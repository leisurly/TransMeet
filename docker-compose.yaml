version: '3.8'

services:
  transmeet:
    build: .
    container_name: transmeet-app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmeet.rule=Host(`transmeet.local`)"
      - "traefik.http.services.transmeet.loadbalancer.server.port=8000"
      - "com.docker.compose.project=transmeet"
      - "com.docker.compose.service=transmeet"

  # 可選：Nginx 反向代理（如果需要）
  nginx:
    image: nginx:alpine
    container_name: transmeet-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - transmeet
    restart: unless-stopped
    profiles:
      - nginx

networks:
  default:
    name: transmeet-network
